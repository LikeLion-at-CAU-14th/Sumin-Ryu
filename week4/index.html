<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>likelion log-in</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div class="container">
        <header>
            <img src="assets/logo.png" alt="logo" class="logo">
            <h2 class="title">회원 가입을 위해 정보를 입력해주세요</h2>
        </header>

        <main>
            <div class="info">
                <span class="speInfo">* 이메일</span> <br>
            </div>

            <div class="info">
                <span class="speInfo">* 이름</span> <br>
            </div>

            <div class="info">
                <span class="speInfo">* 비밀번호</span> <br>
            </div>

            <div class="info">
                <span class="speInfo">* 비밀번호 확인</span> <br>
            </div>
        
            <div class="gender">
                <div class="genderSelect">
                    <div class="genderCircle""></div>
                    <span>여성</span>
                </div>
                <div class="genderSelect">
                    <div class="genderCircle"></div>
                    <span>남성</span>
                </div>
            </div>

            <div class="agreement">
                <div class="checkBox"></div>
                <span class="agreementText">이용약관 개인정보 수집 및 이용, 마케팅 활용 선택에 모두 동의합니다.</span>
            </div>
        </main>

        <footer>
            <button class="join">가입하기</button>
        </footer>
    </div>
</body>
</html>
